
# JMG IDL spec for testing all encodings

package:
  name: "test_jmgc"
  protobuf_package: "jmgc.test"
  protobuf_imports:
    - file: "google/protobuf/timestamp.proto"
types:
  - Active:
      type: "enum"
      underlying_type: "u8"
      values:
        - unknown: 0
        - activated: 1
        - deactivated: 2
  # TODO(bd) support safe strings in JMG objects?
  # - StrId:
  #     type: "str"
  #     concept: "key"
  - IntId:
      type: "u32"
      concept: "key"
# TODO(bd) support groups?
#groups:
objects:
  - InnerMsg:
      - inner_int_32:
          type: "i32"
          protobuf_id: 1
          cbe_id: 1
      - opt_inner_str:
          type: "str"
          required: false
          protobuf_id: 2
          cbe_id: 2
  # test 'required' case for all field types
  - TestMsg:
      # boolean value
      - boolean:
          type: "bool"
          protobuf_id: 1
          cbe_id: 1
      # integer values
      - int_32:
          type: "i32"
          protobuf_id: 2
          cbe_id: 2
      - uint_32:
          type: "u32"
          protobuf_id: 3
          cbe_id: 3
      - sfixed_32:
          # actual protobuf type: sfixed32
          type: "i32"
          protobuf_id: 4
          cbe_id: 4
      - fixed_32:
          # actual protobuf type: fixed_32
          type: "u32"
          protobuf_id: 5
          cbe_id: 5
      - int_64:
          type: "i64"
          protobuf_id: 6
          cbe_id: 6
      - uint_64:
          type: "u64"
          protobuf_id: 7
          cbe_id: 7
      - sfixed_64:
          # actual protobuf type: sfixed64
          type: "i64"
          protobuf_id: 8
          cbe_id: 8
      - fixed_64:
          # actual protobuf type: fixed64
          type: "u64"
          protobuf_id: 9
          cbe_id: 9
      # floating point values
      - flt:
          type: "flt"
          protobuf_id: 10
          cbe_id: 10
      - dbl:
          type: "dbl"
          protobuf_id: 11
          cbe_id: 11
      # string values
      - str:
          type: "str"
          protobuf_id: 12
          cbe_id: 12
      - bytes_str:
          # actual protobuf type: bytes
          type: "str"
          protobuf_id: 13
          cbe_id: 13
      # time point value
      - time_stamp:
          type: "timepoint"
          protobuf_id: 14
          cbe_id: 14
      # safe integer value
      - int_id_fld:
          type: "IntId"
          protobuf_id: 15
          cbe_id: 15
      # enum value
      - active_state:
          type: "Active"
          protobuf_id: 16
          cbe_id: 16
      # array of primitive type
      - ints:
          type: "array"
          subtype: "i32"
          protobuf_id: 17
          cbe_id: 17
      # array of strings
      - strs:
          type: "array"
          subtype: "str"
          protobuf_id: 18
          cbe_id: 18
      # array of messages
      - inner_msgs:
          type: "array"
          subtype: "InnerMsg"
          protobuf_id: 19
          cbe_id: 19
  # test 'optional' case for all types
  - TestOptMsg:
      # boolean value
      - opt_bool:
          type: "bool"
          required: false
          protobuf_id: 1
          cbe_id: 1
      # integer values
      - opt_int_32:
          type: "i32"
          required: false
          protobuf_id: 2
          cbe_id: 2
      - opt_uint_32:
          type: "u32"
          required: false
          protobuf_id: 3
          cbe_id: 3
      - opt_sfixed_32:
          # actual protobuf type: sfixed32
          type: "i32"
          required: false
          protobuf_id: 4
          cbe_id: 4
      - opt_fixed_32:
          # actual protobuf type: fixed_32
          type: "u32"
          required: false
          protobuf_id: 5
          cbe_id: 5
      - opt_int_64:
          type: "i64"
          required: false
          protobuf_id: 6
          cbe_id: 6
      - opt_uint_64:
          type: "u64"
          required: false
          protobuf_id: 7
          cbe_id: 7
      - opt_sfixed_64:
          # actual protobuf type: sfixed64
          type: "i64"
          required: false
          protobuf_id: 8
          cbe_id: 8
      - opt_fixed_64:
          # actual protobuf type: fixed64
          type: "u64"
          required: false
          protobuf_id: 9
          cbe_id: 9
      - opt_flt:
          type: "flt"
          required: false
          protobuf_id: 10
          cbe_id: 10
      # floating point values
      - opt_dbl:
          type: "dbl"
          required: false
          protobuf_id: 11
          cbe_id: 11
      # string values
      - opt_str:
          type: "str"
          required: false
          protobuf_id: 12
          cbe_id: 12
      - opt_bytes_str:
          # actual protobuf type: bytes
          type: "str"
          required: false
          protobuf_id: 13
          cbe_id: 13
      - opt_time_stamp:
          type: "timepoint"
          required: false
          protobuf_id: 14
          cbe_id: 14
      # safe integer value
      - opt_int_id_fld:
          type: "IntId"
          required: false
          protobuf_id: 15
          cbe_id: 15
      # enum value
      - opt_active_state:
          type: "Active"
          required: false
          protobuf_id: 16
